name: android-apk

# Builds the APK and SIGNS it in CI with a FIXED key committed to the repo
# (ci/personal/keystore.jks.b64), so every build has the same signature and
# installs over the previous one without uninstalling. The first run generates
# the key and commits it; later runs reuse it.
on:
  push:
    branches: [orden-por-distancia]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  personal-fcm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build personal FCM companion
        run: |
          git clone https://git.opengrind.org/open-grind/fcm-service.git fcm-source
          cd fcm-source
          git checkout d1e049101104fd2ad3cd421668e3c56be53b3daa
          sed -i '/90F4BB85C1F2FA2A7810A1076A60D20E791720C0EE88FDB88F9E4BA32CA8702E/a\        "08C368C45C38869F375F58F4048EC7D9687BA444DFBA53D0F01501A391C902F4",' app/src/main/java/org/opengrind/fcm/OpenGrindTrust.kt
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: personal-fcm-unsigned-apk
          path: fcm-source/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPEN_GRIND_ANDROID_ABI: aarch64
      KEYSTORE_DIR: ${{ github.workspace }}/../keystore
      KEY_B64: ci/personal/keystore.jks.b64
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Runs first so the fixed key is committed quickly, even if a later push
      # cancels this run.
      - name: Ensure a stable signing key
        run: |
          mkdir -p "$KEYSTORE_DIR"
          if [ -f "$KEY_B64" ]; then
            base64 -d "$KEY_B64" > "$KEYSTORE_DIR/debug.jks"
            echo "Using the committed signing key."
          else
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_DIR/debug.jks" \
              -alias open-grind \
              -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA \
              -validity 20000 \
              -storepass open-grind-debug -keypass open-grind-debug \
              -dname "CN=Martin's Grindr personal build"
            mkdir -p ci/personal
            base64 -w0 "$KEYSTORE_DIR/debug.jks" > "$KEY_B64"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEY_B64"
            git commit -m "Add fixed personal signing key [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Generated and committed a fixed signing key."
          fi

      - name: Write keystore.properties
        run: |
          {
            echo "storeFile=$KEYSTORE_DIR/debug.jks"
            echo "keyAlias=open-grind"
            echo "password=open-grind-debug"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "OPEN_GRIND_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set increasing Android version code
        run: echo "OPEN_GRIND_VERSION_CODE=$((20000000 + 10 * GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build
        run: nix run .#build-android

      - name: Collect APK
        run: |
          shopt -s nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          [ ${#apks[@]} -gt 0 ]
          mkdir -p out
          cp "${apks[@]}" out/
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-apk
          path: out/
          retention-days: 30

  # Keeps only the most recent android-apk runs (with their APKs and logs) and
  # deletes the older ones, so the Actions history stays clean. Runs on every
  # push alongside the build; the current run is newest, so it is always kept.
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old android-apk runs, keep the latest 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "3"
        run: |
          ids=$(gh api "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs | map(select(.name=="android-apk")) | .[].id')
          i=0
          for id in $ids; do
            i=$((i+1))
            if [ "$i" -le "$KEEP" ]; then
              echo "keep run $id"
              continue
            fi
            echo "deleting run $id"
            gh api -X DELETE "/repos/$REPO/actions/runs/$id" || echo "could not delete $id"
          done
