name: android-apk

# Build an unsigned APK. Sign it locally with the retained personal key.
on:
  push:
    branches: [orden-por-distancia]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPEN_GRIND_ANDROID_ABI: aarch64
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set increasing Android version code
        run: echo "OPEN_GRIND_VERSION_CODE=$((11000 + 10 * GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build
        run: nix run .#build-android

      - name: Collect APK
        run: |
          shopt -s nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          [ ${#apks[@]} -gt 0 ]
          mkdir -p out
          cp "${apks[@]}" out/
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-unsigned-apk
          path: out/
          retention-days: 30
