name: web-server

# Builds the web version (server/ + the app's pages) for the Home Assistant
# add-on in martins_grindr/, and publishes it as the release
# web-v<add-on version>, which the add-on's Dockerfile downloads.
on:
  push:
    branches: [orden-por-distancia]
    paths:
      - "server/**"
      - "src/**"
      - "static/**"
      - "package.json"
      - "bun.lock"
      - "martins_grindr/**"
      - ".github/workflows/web-server.yml"
  workflow_dispatch:

concurrency:
  group: web-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Add-on version
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' martins_grindr/config.yaml)
          test -n "$version"
          echo "WEB_VERSION=$version" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
      # Only for `cargo metadata` while building the pages; the server itself
      # is compiled in a Debian container below.
      - uses: dtolnay/rust-toolchain@stable

      - name: System packages for BoringSSL
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev perl

      - name: Install (also patches the Rust dependencies)
        run: bun install --frozen-lockfile

      - name: Build the pages
        run: bun run build

      - name: Build the server
        # Start from the app's lockfile so the Grindr client and its HTTP stack
        # are the exact versions the app ships (and the http2 patch applies).
        # The Home Assistant PC is an Intel Atom N2600 (2011): no SSE4/POPCNT/
        # AVX. The runner's Ubuntu is an amd64v3 build whose compilers and
        # static libraries assume AVX2, so the server is built inside plain
        # Debian (baseline x86-64), with everything pinned to x86-64 as well.
        run: |
          cp src-tauri/Cargo.lock server/Cargo.lock
          docker run --rm -v "$PWD":/w -w /w \
            -e CARGO_HOME=/w/.cargo-home \
            -e RUSTFLAGS="-C target-cpu=x86-64" \
            -e CFLAGS="-march=x86-64 -mtune=generic" \
            -e CXXFLAGS="-march=x86-64 -mtune=generic" \
            rust:1-trixie bash -euc '
              apt-get update -qq
              apt-get install -y -qq cmake clang libclang-dev perl >/dev/null
              cargo build --release --manifest-path server/Cargo.toml
              cargo test --release --manifest-path server/Cargo.toml
            '
          sudo chown -R "$(id -u):$(id -g)" server/target

      - name: Starts on an old CPU (no SSE4/AVX, like the Atom N2600)
        # Inside the same Debian the add-on runs on: the runner's own libraries
        # are amd64v3 builds and would fail under the emulated CPU themselves.
        run: |
          docker run --rm -v "$PWD/server/target/release":/bin-under-test:ro \
            debian:trixie-slim bash -euc '
              apt-get update -qq
              apt-get install -y -qq qemu-user ca-certificates >/dev/null
              if ! qemu-x86_64 -cpu core2duo -d in_asm -D /tmp/qemu.log \
                  /bin-under-test/open-grind-server --self-test; then
                echo "---- last code ----"
                tail -40 /tmp/qemu.log
                exit 1
              fi
            '

      - name: Package
        run: |
          mkdir -p out/web
          cp server/target/release/open-grind-server out/
          cp -r build/. out/web/
          tar -czf open-grind-web.tar.gz -C out .
          ls -la open-grind-web.tar.gz

      - name: Publish release web-v${{ env.WEB_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="web-v$WEB_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" open-grind-web.tar.gz --clobber
          else
            gh release create "$tag" open-grind-web.tar.gz \
              --target "$GITHUB_SHA" --prerelease \
              --title "Web $WEB_VERSION" \
              --notes "Versión web para el complemento de Home Assistant (martins_grindr)."
          fi
